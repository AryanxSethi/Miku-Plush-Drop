<!DOCTYPE html>
<!--
  Miku Plush Drop — page shell.

  Anatomy:
    #game                      → fullscreen Matter.js canvas (physics + rendering)
    header.hud                 → title, drop counter, collection/clear/mute pills
    #collection                → collection modal (progress + tile grid + reset)
    #hint                      → first-drop hint that fades once you click
    matter.min.js              → CDN physics engine (v0.19.0)
    js/main.js                 → ES-module entry; app logic is split across
                                 js/config|storage|state|assets|rarity|audio|
                                 ui|view|world|game|main (.js)

  Requirements:
    * Must be served over HTTP (localStorage + ES modules/CORS all fine on a
      plain static server, but file:// blocks some fetches).
    * PNG assets live under images/ and audio under assets/sound/.
    * The folder can be located on any drive (C:, D:, E:, ...) — all asset
      references are relative.
-->

<body>
<canvas id="game" role="application" aria-label="Miku Plush Drop — Hatsune Miku plushie dropping game canvas; click to drop plushies"></canvas>

<!-- Crawler/JS-off fallback: describes the page since the game needs JavaScript. -->
<noscript>
  <div class="noscript-info">
    <h2>Miku Plush Drop — Hatsune Miku &amp; Vocaloid plushie collection game</h2>
    <p>Click anywhere to drop a random Hatsune Miku plushie. Plushies tumble
    with 2D physics into a pile — collect 100+ Vocaloid-inspired designs plus
    hidden secret plushies, each with its own rarity tier, glow, and sound.
    A free fan-made toy for Miku fans.</p>
    <p>This toy needs JavaScript. Enable JavaScript (or open it from a modern
    browser) to start dropping plushies.</p>
  </div>
</noscript>

<!-- Top HUD: title + live stats and buttons -->
<header class="hud">
  <h1 class="title">Miku Plush <span>Drop</span></h1>
  <div class="stats">
    <span class="pill counter"><b id="count">0</b> plush dropped</span>
    <button class="pill" id="collectBtn" type="button" data-tip="Open your plush collection"><b id="collectCount">0</b>/<span id="collectTotal">0</span> collected</button>
    <button class="pill" id="clearBtn" type="button" data-tip="Clear the pile">Clear pile</button>
    <button class="pill" id="muteBtn" type="button" data-tip="Toggle sound on/off">Sound on</button>
  </div>
</header>

<!-- Collection modal: head, progress bar, scrollable 5-col grid, scroll-top -->
<div class="collection" id="collection">
  <div class="collection-head">
    <div class="collection-titlebar">
      <span class="collection-title">Plush Collection</span>
      <button class="mini" id="resetCollect" type="button" data-tip="Wipe your collection">reset</button>
    </div>
    <button class="collect-close" id="collectClose" type="button" aria-label="Close" data-tip="Close collection">&#10005;</button>
  </div>
  <div class="progress-wrap">
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <span class="progress-text"><b id="progressCount">0</b>/<span id="progressTotal">0</span></span>
  </div>
  <div class="collection-scroll" id="collectionScroll">
    <div class="collection-grid" id="collectionGrid"></div>
  </div>
  <button class="scroll-top" id="scrollTopBtn" type="button" aria-label="Scroll to top" data-tip="Back to top">&#8593;</button>
</div>

<!-- First-drops hint; elements removed when clicking outside UI -->
<div class="hint" id="hint">click anywhere — a Miku plush drops</div>

<!-- Dependencies: Matter.js 0.19.0 (physics). The app logic loads as an ES
     module (js/main.js). ES modules require HTTP (CORS), so when the page is
     opened directly via file:// a classic boot script shows a warning instead
     and skips loading the modules. -->
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
  (function () {
    if (location.protocol === 'file:') {
      var b = document.createElement('div');
      b.className = 'file-warning';
      var code = document.createElement('code');
      code.textContent = 'python -m http.server 8000';
      var h = document.createElement('b');
      h.textContent = 'Open over HTTP to play';
      b.appendChild(h);
      b.appendChild(document.createTextNode('ES modules are blocked from file://. In this folder run '));
      b.appendChild(code);
      b.appendChild(document.createTextNode(' then open http://localhost:8000.'));
      document.body.appendChild(b);
      return;
    }
    var s = document.createElement('script');
    s.type = 'module';
    s.src = 'js/main.js';
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
